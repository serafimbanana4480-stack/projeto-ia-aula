services:
  nexus-backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: nexus-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_DASHBOARD_HOST=http://ollama:11434
      - LOCAL_LLM_DEVICE=cpu
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./data/nexus.db
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-development-jwt-secret-change-in-production}
      # Cloud providers (optional) — set these in your .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - nexus-data:/app/data
      - ../config:/app/config:ro
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - nexus-network

  nexus-frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: nexus-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      nexus-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexus-network

  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - nexus-network

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - nexus-network

  prometheus:
    image: prom/prometheus:latest
    container_name: nexus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - nexus-network

volumes:
  nexus-data:
  redis-data:
  prometheus-data:
  huggingface-cache:
  ollama-data:

networks:
  nexus-network:
    driver: bridge
