[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ide-backend"
version = "0.1.0"
description = "NEXUS IDE orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140",
    # Starlette 1.x moved TestClient to the separate httpx2 package.
    "starlette>=1.3.1,<2.0",
    "uvicorn>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "httpx>=0.27,<0.29",
    "httpcore>=1.0.9,<2",
    "httpx2>=2.9,<3",
    "truststore>=0.10",
    "python-jose[cryptography]>=3.4",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "redis>=5.2",
    "docker>=7.1,<8",
    "prometheus-client>=0.21,<1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ollama>=0.4",
    "pyyaml>=6.0",
    "aiofiles>=24.1",
    "watchdog>=6.0",
    "jinja2>=3.1",
    "websockets>=14.0",
    # New features
    "croniter>=2.0",
    "pyttsx3>=2.90; sys_platform != 'darwin'",
    "edge-tts>=7.0",
    "gTTS>=2.5",
    "pillow>=12.3.0",
    "protobuf>=5.29.6,<7",
    "pyasn1>=0.6.4",
    "rich>=13.9",
    "python-dateutil>=2.9",
    "psutil>=6.0",
    "beautifulsoup4>=4.12",
    "mcp>=1.27,<2",
]

# Optional extras for features that are NOT reachable from
# backend/orchestrator/main.py. Each of these modules had an unguarded
# top-level `import numpy` / `import playwright` for a package that appeared in
# no manifest, so the module died with a bare ModuleNotFoundError on first
# import instead of a useful message -- and any lazy import from a live request
# path would have become a 500.
#
# These are optional rather than hard dependencies on purpose: nothing in the
# 312-path OpenAPI schema needs them, and making them mandatory would add numpy
# (~20 MB) and a browser download to every install for features no code path
# reaches. Declare them optional so the requirement is explicit and installable
# on demand:
#
#   uv sync --extra analytics    # numpy, for:
#                                #   backend/analytics/advanced_analytics.py
#                                #   backend/cache/vector_store.py
#                                #   backend/orchestrator/semantic_cache.py
#   uv sync --extra federated    # numpy, for backend/federated_learning/
#   uv sync --extra quantum      # numpy, for backend/quantum/quantum_computing.py
#   uv sync --extra browser      # playwright, for backend/tools/browser_automation.py
#
# See tools/ci/check_optional_deps.py and backend/tests/persistence/
# test_optional_dependency_manifest.py, which keep this list honest.
[project.optional-dependencies]
analytics = ["numpy>=1.26"]
federated = ["numpy>=1.26"]
quantum = ["numpy>=1.26"]
browser = ["playwright>=1.44"]
# Convenience aggregate for local development and CI images that want it all.
extras = [
    "numpy>=1.26",
    "playwright>=1.44",
]

[dependency-groups]
dev = [
    "pytest-cov>=5,<7",
    # Required by the global `--timeout` in [tool.pytest.ini_options] addopts.
    # Without it pytest aborts at startup with "unrecognized arguments".
    "pytest-timeout>=2.3,<3",
    "ruff>=0.7,<1",
    "mypy>=1.12,<2",
]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
minversion = "8.0"
# --basetemp is NOT set here on purpose. It is assigned per-process in
# backend/tests/conftest.py::pytest_configure, because a single fixed path is
# not concurrency-safe: two pytest processes sharing one --basetemp race on the
# directory wipe and fail with PermissionError (WinError 32) on a still-locked
# SQLite file. Setting it in conftest also keeps an explicit ad-hoc
# `--basetemp=...` on the command line authoritative.
# --timeout: a hang must fail one test, not stall CI forever. 300s is generous
# enough that no existing test comes close; tighten per-test with
# `@pytest.mark.timeout(30)` rather than by lowering this global default.
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider --timeout=300 -W ignore::DeprecationWarning:asyncio.coroutines"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
  "integration: end-to-end tests requiring a live Ollama instance (skipped by default)",
  "contract: tests for API contracts and serialization",
  "timeout(seconds): per-test timeout override; see the global --timeout in addopts",
]
filterwarnings = [
  "error",
  # httpx deprecation we cannot control in FastAPI TestClient
  "ignore::DeprecationWarning:httpx",
  "ignore::PendingDeprecationWarning",
  # python-jose uses deprecated datetime.utcnow() internally
  "ignore::DeprecationWarning:jose",
  # Sockets reclaimed during GC are cosmetic; not a real leak for the test
  "ignore::ResourceWarning",
  # slowapi uses deprecated asyncio.iscoroutinefunction on Python 3.14+
  "ignore::DeprecationWarning:asyncio.coroutines",
  "ignore::DeprecationWarning:slowapi",
  # starlette/fastapi deprecations we cannot control (HTTP_422_UNPROCESSABLE_ENTITY, etc.)
  "ignore::DeprecationWarning:starlette",
  "ignore::DeprecationWarning:fastapi",
  # google/protobuf warnings during import
  "ignore::DeprecationWarning:google",
  "ignore::UserWarning:google",
  # Catch-all for any remaining deprecation warnings from C extensions during import
  "ignore::DeprecationWarning",
  # Windows asyncio pipe cleanup noise
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is handled by formatter

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses `Depends()` in argument defaults by design.
# See https://fastapi.tiangolo.com/tutorial/dependencies/dependencies-in-path-operation-decorators/
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend"]
exclude = ["backend/tests"]
