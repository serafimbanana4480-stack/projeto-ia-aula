[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ide-backend"
version = "0.1.0"
description = "NEXUS IDE orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.10",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.4",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "redis>=5.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ollama>=0.4",
    "pyyaml>=6.0",
    "aiofiles>=24.1",
    "watchdog>=6.0",
    "jinja2>=3.1",
    "websockets>=14.0",
    # New features
    "croniter>=2.0",
    "pyttsx3>=2.90; sys_platform != 'darwin'",
    "edge-tts>=7.0",
    "gTTS>=2.5",
    "pillow>=11.0",
    "rich>=13.9",
    "python-dateutil>=2.9",
]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider -W ignore::DeprecationWarning:asyncio.coroutines"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
  "integration: end-to-end tests requiring a live Ollama instance (skipped by default)",
  "contract: tests for API contracts and serialization",
]
filterwarnings = [
  "error",
  # httpx deprecation we cannot control in FastAPI TestClient
  "ignore::DeprecationWarning:httpx",
  "ignore::PendingDeprecationWarning",
  # python-jose uses deprecated datetime.utcnow() internally
  "ignore::DeprecationWarning:jose",
  # Sockets reclaimed during GC are cosmetic; not a real leak for the test
  "ignore::ResourceWarning",
  # slowapi uses deprecated asyncio.iscoroutinefunction on Python 3.14+
  "ignore::DeprecationWarning:asyncio.coroutines",
  "ignore::DeprecationWarning:slowapi",
  # starlette/fastapi deprecations we cannot control (HTTP_422_UNPROCESSABLE_ENTITY, etc.)
  "ignore::DeprecationWarning:starlette",
  "ignore::DeprecationWarning:fastapi",
  # google/protobuf warnings during import
  "ignore::DeprecationWarning:google",
  "ignore::UserWarning:google",
  # Catch-all for any remaining deprecation warnings from C extensions during import
  "ignore::DeprecationWarning",
  # Windows asyncio pipe cleanup noise
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is handled by formatter

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses `Depends()` in argument defaults by design.
# See https://fastapi.tiangolo.com/tutorial/dependencies/dependencies-in-path-operation-decorators/
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend"]
exclude = ["backend/tests"]
