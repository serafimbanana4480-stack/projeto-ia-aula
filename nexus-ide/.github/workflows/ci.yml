name: NEXUS IDE CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          cd backend
          pytest tests/ --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage to Codecov (optional)
        if: false  # Enable when Codecov is configured
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml

      - name: Run ruff lint
        run: |
          cd backend
          ruff check .

      - name: Run mypy type check
        run: |
          cd backend
          mypy . --ignore-missing-imports

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check
        run: |
          cd frontend
          npm run type-check

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Run vitest
        run: |
          cd frontend
          npm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit safety

      - name: Run bandit
        run: |
          bandit -r backend/ -f json -o bandit-report.json || true
          cat bandit-report.json || echo "No bandit output"

      - name: Run safety
        run: |
          safety check -r backend/requirements.txt || echo "Safety check completed"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build -f docker/backend/Dockerfile -t nexus-backend:test .

      - name: Build frontend image
        run: |
          docker build -f docker/frontend.Dockerfile -t nexus-frontend:test ./frontend

      - name: Build sandbox image
        run: |
          docker build -f docker/sandbox.Dockerfile -t nexus-sandbox:test .
