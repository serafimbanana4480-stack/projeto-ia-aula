# THIS WORKFLOW NEVER RAN. IT IS NOT LOADED BY GITHUB ACTIONS.
#
# The git repository root is the PARENT of nexus-ide/, not nexus-ide/ itself.
# GitHub Actions only discovers workflows in `<repo-root>/.github/workflows/`,
# so this file has been inert: no job, no badge, no signal. The "backend job is
# a no-op" symptom in the old file was the smaller half of the problem -- the
# whole pipeline was dead.
#
# The working pipeline now lives at:
#
#     <repo-root>/.github/workflows/ci.yml
#
# and fixes, among others:
#   * runs every backend command from nexus-ide/ so `pythonpath = ["."]` and
#     `packages = ["backend"]` resolve (the old `cd backend` broke every
#     `backend.*` absolute import),
#   * installs from pyproject.toml/uv.lock instead of the stale
#     backend/requirements.txt, which pinned fastapi==0.115.0 against a >=0.140
#     floor and missed 18 real dependencies,
#   * runs mypy with the project's own config (strict = true) instead of
#     overriding it with --ignore-missing-imports,
#   * replaces the meaningless 5% coverage floor with a measured one, and
#     replaces `ruff check` failing outright with a ratchet that only fails on
#     regression,
#   * makes codecov, bandit and safety actually run (they were `if: false`,
#     `|| true` and `|| echo` respectively),
#   * uses pnpm and pnpm-lock.yaml instead of npm and a package-lock.json that
#     does not exist.
#
# This stub is kept, not deleted, per AGENTS.md rule 1 (nothing is deleted;
# history goes to archive/). Do not edit it -- edit the root workflow.
