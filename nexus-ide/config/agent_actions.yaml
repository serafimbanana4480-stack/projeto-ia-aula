# NEXUS IDE — Agent Action Registry
# Maps each ReAct AgentAction enum to a tool name and an example arguments
# template. Loaded by backend/agents/action_registry.py.
# Edit this file to add/remove actions without touching agent code.
#
# Each action MAY include:
#   tool:                     (required) tool name in backend/tools/registry
#   example_args:             (required) JSON example args for the tool
#   when_to_use:              (optional) 1-sentence hint for the LLM
#   risk_level:               (optional) "low" | "medium" | "high"
#   requires_confirmation:    (optional) bool — if true, user must confirm
#   tags:                     (optional) list of tags for filtering
#   examples:                 (optional) list of example invocations

actions:
  # --- File operations ---
  READ_FILE:
    tool: read_file
    example_args: '{"path": "backend/main.py"}'
    when_to_use: "When you need to inspect the contents of an existing file in the project."
    risk_level: "low"
    tags: ["file", "read", "fs"]
    examples:
      - path: "backend/main.py"
      - path: "config/models.yaml"
  WRITE_FILE:
    tool: write_file
    example_args: '{"path": "src/utils.py", "content": "def hello():\n    pass"}'
    when_to_use: "When you need to create a new file or modify an existing one within the project."
    risk_level: "medium"
    requires_confirmation: false
    tags: ["file", "write", "fs"]
    examples:
      - path: "src/utils.py"
        content: "def hello():\n    return 'world'"
  WRITE_FILE_ABSOLUTE:
    tool: write_file_absolute
    example_args: '{"path": "/etc/hosts", "content": ""}'
    when_to_use: "When you need to write to an absolute path outside the project (use with care)."
    risk_level: "high"
    requires_confirmation: true
    tags: ["file", "write", "fs", "absolute"]
  READ_FILE_ABSOLUTE:
    tool: read_file_absolute
    example_args: '{"path": "/etc/nginx/nginx.conf"}'
    when_to_use: "When you need to read a file at an absolute path (e.g. system config)."
    risk_level: "medium"
    tags: ["file", "read", "fs", "absolute"]
  LIST_DIR:
    tool: list_dir
    example_args: '{"path": "backend/"}'
    when_to_use: "When you need to see what files exist in a project directory."
    risk_level: "low"
    tags: ["file", "list", "fs"]
  LIST_DIR_ABSOLUTE:
    tool: list_dir_absolute
    example_args: '{"path": "/var/log/"}'
    when_to_use: "When you need to list an absolute directory path (e.g. system logs)."
    risk_level: "medium"
    tags: ["file", "list", "fs", "absolute"]

  # --- Code execution ---
  EXECUTE_CODE:
    tool: execute_code
    example_args: '{"code": "print(2 + 2)", "language": "python"}'
    when_to_use: "When you need to run a code snippet to verify behavior or compute something."
    risk_level: "medium"
    tags: ["code", "exec", "sandbox"]
    examples:
      - code: "import math; print(math.sqrt(16))"
        language: "python"
  RUN_SHELL:
    tool: run_shell
    example_args: '{"command": "git status --short", "project_path": "."}'
    when_to_use: "When you need to run a project command, inspect logs, or reproduce a failure in the real workspace."
    risk_level: "medium"
    tags: ["code", "shell", "debug"]

  # --- Code search ---
  SEARCH_CODEBASE:
    tool: search_codebase
    example_args: '{"query": "authentication middleware", "project_path": "."}'
    when_to_use: "When you need to find semantically similar code in the project (uses embeddings)."
    risk_level: "low"
    tags: ["code", "search", "embedding"]
  SEARCH_SYMBOLS:
    tool: search_symbols
    example_args: '{"query": "authenticate", "kind": "function"}'
    when_to_use: "When you need to find a function, class, or variable by name."
    risk_level: "low"
    tags: ["code", "search", "symbol"]
  INDEX_SYMBOLS:
    tool: index_symbols
    example_args: '{"project_path": ".", "force_reindex": false}'
    when_to_use: "When you need to (re)build the symbol index for fast symbol lookups."
    risk_level: "low"
    tags: ["code", "index"]

  # --- Web ---
  SEARCH_WEB:
    tool: web_search
    example_args: '{"query": "FastAPI authentication best practices"}'
    when_to_use: "When you need to search the web for current information."
    risk_level: "low"
    tags: ["web", "search"]
  FETCH_URL:
    tool: fetch_url
    example_args: '{"url": "https://fastapi.tiangolo.com/tutorial/"}'
    when_to_use: "When you need to fetch and summarise content from a specific URL."
    risk_level: "low"
    tags: ["web", "fetch"]
  SEARCH_GITHUB:
    tool: search_github
    example_args: '{"query": "rust web framework", "language": "rust", "stars_min": 100}'
    when_to_use: "When you need to find open-source projects on GitHub matching criteria."
    risk_level: "low"
    tags: ["web", "github", "search"]
  SEARCH_DOCS:
    tool: search_docs
    example_args: '{"query": "authentication", "framework": "fastapi"}'
    when_to_use: "When you need to search the official documentation of a framework."
    risk_level: "low"
    tags: ["web", "docs", "search"]
  DEEP_RESEARCH:
    tool: deep_research
    example_args: '{"query": "state of vector databases 2026", "max_results": 5}'
    when_to_use: "When you need a comprehensive research report on a topic from multiple sources."
    risk_level: "low"
    tags: ["web", "research", "deep"]
  API_REQUEST:
    tool: api_request
    example_args: '{"url": "https://api.example.com/v1/data", "method": "GET"}'
    when_to_use: "When you need to make an HTTP request to any external API (GET/POST/PUT/DELETE)."
    risk_level: "medium"
    tags: ["api", "http", "request"]
    examples:
      - url: "https://api.github.com/repos/owner/repo"
        method: "GET"

  # --- Agent collaboration ---
  CONSULT_AGENT:
    tool: consult_agent
    example_args: '{"agent": "ARCHITECT", "question": "How should I structure the auth module?"}'
    when_to_use: "When you need an expert opinion from a specialist agent (e.g. ARCHITECT, DEBUGGER)."
    risk_level: "low"
    tags: ["agent", "consult", "a2a"]
  SPAWN_TASK:
    tool: spawn_task
    example_args: '{"name": "Run focused verification", "description": "Execute the affected tests and report failures", "agent": "DEBUGGER", "depends_on": []}'
    when_to_use: "When an independent follow-up task is required and can be scheduled by the orchestrator."
    risk_level: "low"
    tags: ["agent", "task", "spawn"]
  READ_DOCS:
    tool: read_file
    example_args: '{"path": "docs/auth.md"}'
    when_to_use: "When you need to read project documentation files."
    risk_level: "low"
    tags: ["doc", "read"]

  # --- Memory / context ---
  RECALL_CONTEXT:
    tool: recall_context
    example_args: '{"query": "user prefers dark mode", "session_id": "sess-123"}'
    when_to_use: "When you need to remember a fact or context from a previous conversation."
    risk_level: "low"
    tags: ["memory", "recall", "context"]
  STORE_MEMORY:
    tool: store_memory
    example_args: '{"content": "User is working on NEXUS IDE v2", "memory_type": "project", "tags": "context,project"}'
    when_to_use: "When you need to save a fact, preference, or project context for future sessions."
    risk_level: "low"
    tags: ["memory", "store", "context"]

  # --- Validated MCP context ---
  MCP_PROJECT_CONTEXT:
    tool: mcp_project_context
    example_args: '{"task": "Find the symbols and dependencies relevant to this change", "token_budget": 1200}'
    when_to_use: "When a bounded semantic map can replace reading large source files before a code change."
    risk_level: "low"
    tags: ["mcp", "projectmind", "semantic", "read"]
  MCP_IMPACT_ANALYSIS:
    tool: mcp_impact_analysis
    example_args: '{"node_id_or_diff": "MCPConnectorStore.test_connector"}'
    when_to_use: "Before changing a shared symbol or applying a broad diff, to estimate affected dependants."
    risk_level: "low"
    tags: ["mcp", "projectmind", "impact", "read"]
  MCP_SEQUENTIAL_THINKING:
    tool: mcp_sequential_thinking
    example_args: '{"thought": "Compare the architecture options", "thought_number": 1, "total_thoughts": 3, "complexity": 8, "architecture": true}'
    when_to_use: "Only for complexity >= 7, architecture work, two failed debugging attempts, or confidence < 0.7."
    risk_level: "low"
    tags: ["mcp", "sequential-thinking", "reasoning"]

  # --- Data / reports ---
  ANALYZE_DATA:
    tool: data_analysis
    example_args: '{"data_path": "data/sales.csv", "query": "What are the top 3 products?"}'
    when_to_use: "When you need to analyse a CSV/JSON file with statistics."
    risk_level: "low"
    tags: ["data", "analysis"]
  GENERATE_REPORT:
    tool: report_generation
    example_args: '{"title": "Q4 Performance", "sections": "[{\"name\": \"Overview\", \"content\": \"...\"}]"}'
    when_to_use: "When you need to generate a structured report (markdown/HTML/text)."
    risk_level: "low"
    tags: ["report", "doc"]

  # --- Scaffolding ---
  SCAFFOLD_PROJECT:
    tool: scaffold_project
    example_args: '{"name": "my-fastapi-app", "template": "fastapi"}'
    when_to_use: "When you need to create a new project from a template (FastAPI, fullstack, etc)."
    risk_level: "medium"
    tags: ["scaffold", "project", "template"]

  # --- Git (v1 tools) ---
  GIT_PULL:
    tool: git_pull
    example_args: '{"command": "origin main"}'
    when_to_use: "When you need to pull changes from a remote repository."
    risk_level: "low"
    tags: ["git", "vcs", "pull"]
  GIT_PUSH:
    tool: git_push
    example_args: '{"command": "origin main", "confirm": true}'
    when_to_use: "When you need to push commits to a remote. Requires confirm=true."
    risk_level: "high"
    requires_confirmation: true
    tags: ["git", "vcs", "push"]
  DOCKER_PS:
    tool: docker_ps
    example_args: '{"all": false}'
    when_to_use: "When you need to list Docker containers."
    risk_level: "low"
    tags: ["docker", "container"]
  DOCKER_BUILD:
    tool: docker_build
    example_args: '{"image_tag": "myapp:v1", "project_path": "."}'
    when_to_use: "When you need to build a Docker image from a Dockerfile."
    risk_level: "medium"
    tags: ["docker", "container", "build"]
  DOCKER_RUN:
    tool: docker_run
    example_args: '{"image": "nginx:latest", "ports": "8080:80", "detach": true}'
    when_to_use: "When you need to run a Docker container from an image."
    risk_level: "medium"
    tags: ["docker", "container", "run"]
  DOCKER_COMPOSE_UP:
    tool: docker_compose_up
    example_args: '{"project_path": ".", "detach": true, "build": false}'
    when_to_use: "When you need to start a docker-compose stack."
    risk_level: "medium"
    tags: ["docker", "compose"]
  DOCKER_COMPOSE_DOWN:
    tool: docker_compose_down
    example_args: '{"project_path": "."}'
    when_to_use: "When you need to stop a docker-compose stack."
    risk_level: "medium"
    tags: ["docker", "compose"]
  DOCKER_LOGS:
    tool: docker_logs
    example_args: '{"container": "myapp", "tail": 100}'
    when_to_use: "When you need to inspect logs of a Docker container."
    risk_level: "low"
    tags: ["docker", "logs"]

  # --- Database ---
  DB_QUERY:
    tool: db_query
    example_args: '{"query": "SELECT * FROM users LIMIT 10"}'
    when_to_use: "When you need to read data from the database (SELECT only)."
    risk_level: "low"
    tags: ["db", "sql", "query"]
  DB_EXECUTE:
    tool: db_execute
    example_args: '{"query": "UPDATE users SET active = 1", "confirm": true}'
    when_to_use: "When you need to write data to the database. Requires confirm=true."
    risk_level: "high"
    requires_confirmation: true
    tags: ["db", "sql", "execute"]
  DB_SCHEMA:
    tool: db_schema
    example_args: '{}'
    when_to_use: "When you need to list all tables in the database."
    risk_level: "low"
    tags: ["db", "schema"]
  DB_TABLES:
    tool: db_tables
    example_args: '{}'
    when_to_use: "When you need to list all tables and their columns."
    risk_level: "low"
    tags: ["db", "schema"]

  # --- Notifications ---
  SEND_WEBHOOK:
    tool: send_webhook
    example_args: '{"url": "https://hooks.slack.com/services/...", "message": "Build succeeded"}'
    when_to_use: "When you need to send a notification to a webhook (Slack/Discord/Teams/generic)."
    risk_level: "low"
    tags: ["notification", "webhook", "alert"]
  SEND_EMAIL:
    tool: send_email_notification
    example_args: '{"to": "user@example.com", "subject": "Build failed", "body": "See logs..."}'
    when_to_use: "When you need to send an email notification (requires SMTP config)."
    risk_level: "low"
    tags: ["notification", "email"]
  DESKTOP_NOTIFY:
    tool: show_desktop_notification
    example_args: '{"title": "Build done", "message": "All tests passed"}'
    when_to_use: "When you need to show a native desktop notification."
    risk_level: "low"
    tags: ["notification", "desktop"]

  # --- Quality / testing ---
  RUN_TESTS:
    tool: run_tests
    example_args: '{"test_path": "backend/tests", "coverage": true}'
    when_to_use: "When you need to run pytest and get structured test results."
    risk_level: "low"
    tags: ["test", "pytest", "quality"]
  RUN_LINT:
    tool: run_lint
    example_args: '{"path": "backend/", "fix": false}'
    when_to_use: "When you need to run ruff linter on code."
    risk_level: "low"
    tags: ["quality", "lint"]
  FORMAT_CODE:
    tool: format_code
    example_args: '{"path": "backend/", "check": true}'
    when_to_use: "When you need to run ruff formatter (or just check if code is formatted)."
    risk_level: "low"
    tags: ["quality", "format"]
  TYPE_CHECK:
    tool: type_check
    example_args: '{"path": "backend/", "strict": false}'
    when_to_use: "When you need to run mypy type checker (best-effort)."
    risk_level: "low"
    tags: ["quality", "type", "mypy"]
