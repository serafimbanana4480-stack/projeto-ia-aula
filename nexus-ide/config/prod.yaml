# Production Environment Configuration
# This file overrides default settings for production environment

# Application Settings
app:
  name: "NEXUS IDE (Production)"
  debug: false
  log_level: "WARNING"
  reload: false

# CORS Settings
cors:
  allowed_origins:
    - "https://nexus-ide.example.com"
  allow_credentials: true
  allow_methods: ["GET", "POST", "PUT", "DELETE"]
  allow_headers: ["*"]

# Database Settings
database:
  url: "postgresql://user:pass@localhost:5432/nexus_prod"
  echo: false

# Redis Settings
redis:
  url: "redis://localhost:6379"
  db: 0
  password: null

# Local LLM (AirLLM) Settings
local_llm:
  device: "auto"
  dashboard_device: "cpu"
  compression: "4bit"
  timeout: 600
  retry_attempts: 2

# Observability Settings
observability:
  enable_tracing: true
  enable_metrics: true
  otel_exporter_otlp_endpoint: "http://otel-collector:4317"
  prometheus_port: 9090

# Rate Limiting
rate_limiting:
  enabled: true
  requests_per_minute: 60

# Security Settings
security:
  secret_key: "${SECRET_KEY}"
  session_expire_hours: 24

# Feature Flags
features:
  enable_web_search: true
  enable_code_execution: true
  enable_file_operations: true
  enable_terminal: false
  max_file_size_mb: 100

# Logging
logging:
  level: "WARNING"
  format: "json"
  file: "logs/nexus_prod.log"
