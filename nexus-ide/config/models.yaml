# NEXUS / LUSO AI IDE — Multi-Model Configuration
# OpenCode Go is the primary cloud provider.
# All model IDs below are resolved by OpenCodeGoProvider.resolve_model().

models:
  # MICRO — perguntas triviais (1+1, classificação rápida, routing)
  # Usa um modelo cloud pequeno e barato (MiMo-V2.5) para latência mínima
  micro:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 512
    context_window: 131072
    temperature: 0.3
    use_cases: [trivial_qa, routing, classification]
    estimated_latency_ms: 200

  # FAST — respostas rápidas, formatação leve, sumários
  # Usa o flash tier do DeepSeek (cheap + fast)
  fast:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 2048
    context_window: 131072
    temperature: 0.7
    use_cases: [simple_qa, formatting, summarization]
    estimated_latency_ms: 600

  # CODER — geração e análise de código
  # Usa o Kimi-K2.7-Code (modelo especializado em código)
  coder:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 8192
    context_window: 131072
    temperature: 0.5
    use_cases: [code_generation, refactor, debug]
    estimated_latency_ms: 1200

  # REASONING — raciocínio multi-step com thinking
  # Usa o GLM-5.2 com thinking_mode (excelente para raciocínio)
  reasoning:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: true
    max_tokens: 8192
    context_window: 131072
    temperature: 0.5
    use_cases: [planning, multi_step_reasoning, problem_solving]
    estimated_latency_ms: 2000

  # DEEP — análises complexas, arquitetura
  # Usa o DeepSeek-V4-Pro (premium) para respostas da mais alta qualidade
  deep:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: true
    max_tokens: 16384
    context_window: 131072
    temperature: 0.4
    use_cases: [architecture, complex_analysis, large_codebases]
    estimated_latency_ms: 4000

  # Aliases retro-compatibilidade (legacy registry)
  q3b-4bit:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 4096
    context_window: 131072
    temperature: 0.5
    use_cases: [simple_qa, formatting, summarization]
  coder3b-4bit:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 4096
    context_window: 131072
    temperature: 0.2
    use_cases: [code_generation, refactor, debug]
  nano:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 512
    context_window: 131072
    temperature: 0.1
    use_cases: [trivial_qa, routing, classification]
  small:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 4096
    context_window: 131072
    temperature: 0.7
    use_cases: [simple_qa, formatting, summarization]
  medium:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 8192
    context_window: 131072
    temperature: 0.3
    use_cases: [code_generation, planning, multi_step_reasoning]
  large:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: true
    max_tokens: 8192
    context_window: 131072
    temperature: 0.7
    use_cases: [architecture, complex_analysis, large_codebases]
  expert:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: true
    max_tokens: 16384
    context_window: 131072
    temperature: 0.3
    use_cases: [architecture, complex_analysis, large_codebases]
  vision:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 2048
    context_window: 131072
    temperature: 0.7
    use_cases: [image_analysis, vision_tasks]
  embed:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 512
    context_window: 131072
    temperature: 0.0
    use_cases: [embedding, retrieval]
  dashboard:
    id: "openrouter/free"
    fallback_id: "openrouter/free"
    thinking_mode: false
    max_tokens: 2048
    context_window: 131072
    temperature: 0.5
    use_cases: [dashboard_queries, monitoring]

concurrency:
  NANO: 5
  MICRO: 5
  FAST: 4
  SMALL: 3
  CODER: 2
  MEDIUM: 2
  REASONING: 1
  LARGE: 1
  DEEP: 1
  EXPERT: 1
  VISION: 1
  DASHBOARD: 2

routing:
  fast_threshold_words: 20
  trivial_threshold_words: 6
  complexity_thresholds:
    deep_thinking: 7
    iterative_react: 6
  # The request-level 0 value uses the bounded safety default rather than an
  # unbounded loop. Override it with NEXUS_REACT_MAX_ITERATIONS (for example,
  # 8 for a constrained multi-step task).
  max_react_iterations: 4
  fallback_timeout_seconds: 45
  queue_timeout_seconds: 30

# Smart Router — keywords que forçam tier
smart_router:
  trivial_keywords: ["+", "-", "*", "/", "=", "what is", "quanto é", "quanto e"]
  code_keywords: ["function", "class", "def ", "import ", "const ", "implement", "refactor", "bug"]
  reasoning_keywords: ["plan", "step by step", "explain why", "compare", "analyze"]
  deep_keywords: ["architecture", "design system", "scalable", "trade-off"]

fallback:
  ARCHITECT:  [ANALYZER, CODER, MICRO]
  CODER:      [DEBUGGER, MICRO]
  ANALYZER:   [CODER, MICRO]
  DEBUGGER:   [CODER, MICRO]
  RESEARCHER: [MICRO]
  OPTIMIZER:  [CODER, MICRO]
  DOCUMENTER: [MICRO]
  MICRO:      []

web_search:
  provider: "duckduckgo"
  max_results_per_query: 10
  max_queries_per_task: 5
  max_page_fetches: 3
  relevance_threshold: 0.7

code_execution:
  timeout_seconds: 30
  max_memory_mb: 512
  allowed_languages: [python, javascript, typescript, bash, rust, go]

# Configured LLM providers. Used by /api/providers to show available backends.
# OpenCode Go is the primary and default cloud provider.
providers:
  opencode_go:
    name: "OpenCode Go"
    base_url: "https://opencode.ai/zen/go/v1"
    requires_api_key: true
    primary: true
    default_models:
      - "openrouter/free"
  # Optional: Ollama (local). Only enabled if NEXUS_ENABLE_OLLAMA=true.
  ollama:
    name: "Ollama (local)"
    base_url: "http://localhost:11434"
    requires_api_key: false
    enabled_by_default: false
    default_models:
      - "qwen2.5:0.5b"
      - "qwen2.5:1.5b"

