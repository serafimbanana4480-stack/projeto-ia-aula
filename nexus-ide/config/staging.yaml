# Staging Environment Configuration
# This file overrides default settings for staging environment

# Application Settings
app:
  name: "NEXUS IDE (Staging)"
  debug: true
  log_level: "INFO"
  reload: false

# CORS Settings
cors:
  allowed_origins:
    - "https://staging.nexus-ide.example.com"
    - "http://localhost:3000"
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

# Database Settings
database:
  url: "postgresql://user:pass@localhost:5432/nexus_staging"
  echo: false

# Redis Settings
redis:
  url: "redis://localhost:6379"
  db: 0
  password: null

# Local LLM (AirLLM) Settings
local_llm:
  device: "auto"
  dashboard_device: "cpu"
  compression: "4bit"
  timeout: 600
  retry_attempts: 2

# Observability Settings
observability:
  enable_tracing: true
  enable_metrics: true
  otel_exporter_otlp_endpoint: "http://localhost:4317"
  prometheus_port: 9090

# Rate Limiting
rate_limiting:
  enabled: true
  requests_per_minute: 120

# Security Settings
security:
  secret_key: "staging-secret-key"
  session_expire_hours: 24

# Feature Flags
features:
  enable_web_search: true
  enable_code_execution: true
  enable_file_operations: true
  enable_terminal: true
  max_file_size_mb: 75

# Logging
logging:
  level: "INFO"
  format: "detailed"
  file: "logs/nexus_staging.log"
