id: feature-flags-audit
name: Feature flags audit
description: Audit a codebase for feature-flag usage. Surface dead flags, missing defaults, inconsistent naming.
category: code-quality
icon: flag
mode: review
strategy: ensemble
agents: [INVESTIGATOR, REVIEWER]
max_iterations: 4
tags: [feature-flags, audit, cleanup]
variables:
  - name: project_path
    label: Project root
    description: Absolute path to the project root
    default: "."
    multiline: false
objective_template: |
  Audit the codebase at {project_path} for feature-flag usage.

  Produce:
  1. List of every feature-flag system in use (LaunchDarkly, Unleash, custom, etc.)
  2. Naming convention (camelCase / snake_case / kebab-case)
  3. Default-on / default-off consistency
  4. Dead flags (defined but never referenced)
  5. Stale flags (defined > 90 days ago, not removed)
  6. Recommended cleanup plan
