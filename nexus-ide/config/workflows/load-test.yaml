id: load-test
name: Load test planning
description: "Plan a load test: traffic model, ramp-up, success criteria, abort criteria."
category: sre
icon: activity
mode: planning
strategy: divide
agents: [ARCHITECT, INVESTIGATOR]
max_iterations: 4
tags: [load-test, performance, sre]
variables:
  - name: target
    label: Target system
    description: "What are we load-testing (URL, service name, scenario)"
    required: true
    multiline: false
  - name: rps
    label: Target RPS
    description: "Target requests per second"
    default: "1000"
    multiline: false
objective_template: |
  Plan a load test for {target} at {rps} RPS.

  Produce:
  1. Traffic model (mix of read/write/auth/etc)
  2. Ramp-up plan (10/25/50/100% over X minutes)
  3. Success criteria (p50/p95/p99 latency, error rate)
  4. Abort criteria (when to stop)
  5. Tooling recommendation (k6, Locust, JMeter, Vegeta)
  6. Report template
