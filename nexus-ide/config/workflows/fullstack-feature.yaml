id: fullstack-feature
name: Full-stack feature
description: Plan + implement + review a small full-stack feature (API + UI + tests).
category: fullstack
icon: layers
mode: implementation
strategy: pipeline
agents: [ARCHITECT, IMPLEMENTER, REVIEWER]
max_iterations: 6
tags: [fullstack, feature, scaffold]
variables:
  - name: feature
    label: Feature description
    description: What the feature does, in one paragraph
    required: true
    multiline: true
  - name: stack
    label: Stack
    description: Tech stack (e.g. FastAPI + Next.js + Postgres)
    default: FastAPI + Next.js + Postgres
    multiline: false
objective_template: |
  Plan and emit a Proposal for the following full-stack feature.

  ## Feature
  {feature}

  ## Stack
  {stack}

  Deliver a Proposal that lists:
  - API endpoints (FastAPI / route handlers)
  - UI components (Next.js / React)
  - Database schema or migrations
  - Tests to add (unit + integration)
  - Risks + open questions
  Cite every file:line range you used.
