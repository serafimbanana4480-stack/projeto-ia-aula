id: incident-response
name: Incident response runbook
description: Step-by-step incident-response playbook with role assignments, comms, and rollback.
category: sre
icon: siren
mode: planning
strategy: pipeline
agents: [ARCHITECT, INVESTIGATOR]
max_iterations: 1000
tags: [sre, incident, runbook]
variables:
  - name: severity
    label: Severity
    description: Severity level (SEV1 / SEV2 / SEV3)
    required: true
    multiline: false
  - name: service
    label: Service
    description: Affected service
    required: true
    multiline: false
  - name: symptoms
    label: Symptoms
    description: What the user / monitor is reporting
    required: true
    multiline: true
objective_template: |
  Generate an incident-response runbook.

  ## Severity
  {severity}

  ## Service
  {service}

  ## Symptoms
  {symptoms}

  Produce:
  1. Roles & responsibilities (IC, comms lead, scribe, SMEs)
  2. Triage checklist (first 5 minutes)
  3. Mitigation steps with rollback
  4. Customer comms templates (status page, in-app banner, support reply)
  5. Post-incident checklist
