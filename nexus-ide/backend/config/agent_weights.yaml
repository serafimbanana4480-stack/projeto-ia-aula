# Agent Weights Configuration for Enhanced Agent Parliament
# Each agent has different weights based on their specialization

agent_weights:
  ARCHITECT:
    architecture: 2.0
    implementation: 1.2
    research: 0.8
    analysis: 1.0
    optimization: 1.0
    default: 1.0
    
  RESEARCHER:
    research: 2.0
    architecture: 1.2
    implementation: 0.8
    analysis: 1.0
    optimization: 0.8
    default: 1.0
    
  CODER:
    implementation: 2.0
    architecture: 1.0
    research: 0.8
    analysis: 0.8
    optimization: 1.2
    default: 1.0
    
  ANALYZER:
    analysis: 2.0
    architecture: 1.0
    implementation: 0.8
    research: 1.0
    optimization: 1.2
    default: 1.0
    
  OPTIMIZER:
    optimization: 2.0
    implementation: 1.2
    architecture: 1.0
    research: 0.8
    analysis: 1.0
    default: 1.0

# Consensus threshold (0.0-1.0)
# Consensus is reached if weighted average >= threshold
# or if standard deviation of votes is low
consensus_threshold: 0.7

# Consensus standard deviation threshold (0.0-1.0)
# Consensus is reached if standard deviation of votes <= this threshold
# This provides an alternative path to consensus when votes are tightly clustered
consensus_std_dev_threshold: 0.3

# Weight adjustment rate (0.0-1.0)
# How much to adjust weights based on outcomes
weight_adjustment_rate: 0.05

# Minimum and maximum weights for any agent
min_weight: 0.5
max_weight: 3.0

# Resource efficiency threshold (0.0-1.0)
# Minimum acceptable resource efficiency score for decision evaluation
# Decisions with efficiency below this threshold are considered resource-intensive
resource_efficiency_threshold: 0.6

# Evaluation metric weights (for DecisionEvaluator)
# Weights for different evaluation metrics (will be normalized to sum to 1.0)
metric_weights:
  success_rate: 0.4
  time_efficiency: 0.2
  quality_score: 0.3
  resource_efficiency: 0.1
  stakeholder_satisfaction: 0.0
